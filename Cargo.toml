[package]
name = "ascension"
version = "3.4.1"
edition = "2024"
description = "Elden Ring: Ascension — offline progression and native runtime"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.9"
fs2 = "0.4.3"
md5 = "0.8"

[target.'cfg(windows)'.dependencies]
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "57023153d786c4b13fe95d9170e6dcd9d35093ea" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "57023153d786c4b13fe95d9170e6dcd9d35093ea" }
from-singleton = "=3.0.1"
hudhook = { version = "=0.9.3", default-features = false, features = ["dx12", "imgui-tables-api"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_Media_Audio"] }

[profile.release]
panic = "unwind"
strip = true
lto = "thin"

